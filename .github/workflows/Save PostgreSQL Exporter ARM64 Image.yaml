name: Pull enmotech/openGauss Exporter ARM64 Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签 (默认: latest)'
        required: false
        default: 'latest'
        type: string

jobs:
  pull-and-save:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Set up QEMU for multi-platform
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    
    - name: Pull openGauss Exporter ARM64 image
      run: |
        # 拉取 enmotech/opengauss_exporter 镜像
        docker pull --platform linux/arm64 enmotech/opengauss_exporter:${{ github.event.inputs.image_tag }}
        
        # 查看镜像信息
        docker images | grep opengauss_exporter
    
    - name: Re-tag image for easier identification
      run: |
        docker tag enmotech/opengauss_exporter:${{ github.event.inputs.image_tag }} opengauss-exporter:arm64
        docker tag enmotech/opengauss_exporter:${{ github.event.inputs.image_tag }} opengauss-exporter:${{ github.event.inputs.image_tag }}
    
    - name: Save image as tar file
      run: |
        docker save opengauss-exporter:arm64 -o opengauss-exporter-arm64.tar
        ls -lh opengauss-exporter-arm64.tar
    
    - name: Compress tar file
      run: |
        gzip -c opengauss-exporter-arm64.tar > opengauss-exporter-arm64.tar.gz
        ls -lh opengauss-exporter-arm64.tar.gz
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: opengauss-exporter-arm64
        path: |
          opengauss-exporter-arm64.tar
          opengauss-exporter-arm64.tar.gz
        retention-days: 30
        compression-level: 0
