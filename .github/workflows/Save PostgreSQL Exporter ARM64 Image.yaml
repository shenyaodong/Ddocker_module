name: Pull PostgreSQL Exporter ARM64 Image

on:
  workflow_dispatch:

jobs:
  pull-and-save:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Pull PostgreSQL Exporter ARM64 image
      run: |
        docker pull --platform linux/arm64 prometheuscommunity/postgres-exporter:v0.15.0
    
    - name: Save image as tar
      run: |
        docker save prometheuscommunity/postgres-exporter:v0.15.0 -o postgres-exporter-arm64.tar
    
    - name: Upload tar artifact
      uses: actions/upload-artifact@v4
      with:
        name: postgres-exporter-arm64
        path: postgres-exporter-arm64.tar
        retention-days: 30
