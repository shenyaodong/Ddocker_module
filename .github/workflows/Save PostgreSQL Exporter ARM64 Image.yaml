name: Save PostgreSQL Exporter ARM64 Image

on:
  workflow_dispatch:

jobs:
  save-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Clone PostgreSQL Exporter source
      run: |
        git clone --depth 1 https://github.com/prometheus-community/postgres_exporter.git
        cd postgres_exporter
        echo "Latest commit:"
        git log -1 --oneline

    - name: Build ARM64 binary
      working-directory: ./postgres_exporter
      run: |
        # 直接使用 go build 构建 ARM64 二进制
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
          -ldflags="-s -w" \
          -o postgres_exporter \
          cmd/postgres_exporter/main.go
        echo "=== Binary info ==="
        file postgres_exporter
        ls -lh postgres_exporter

    - name: Create Dockerfile
      working-directory: ./postgres_exporter
      run: |
        cat > Dockerfile << 'EOF'
        FROM alpine:3.19
        
        RUN apk add --no-cache ca-certificates tzdata
        
        WORKDIR /app
        
        COPY postgres_exporter /app/postgres_exporter
        
        RUN chmod +x /app/postgres_exporter
        
        EXPOSE 9187
        
        ENTRYPOINT ["/app/postgres_exporter"]
        CMD ["--web.listen-address=:9187"]
        EOF

    - name: Build ARM64 Docker image
      run: |
        cd postgres_exporter
        docker buildx build \
          --platform linux/arm64 \
          --load \
          -t postgres-exporter:arm64 \
          -f Dockerfile \
          .
        docker images | grep postgres-exporter

    - name: Save image as tar
      run: |
        docker save postgres-exporter:arm64 -o postgres-exporter-arm64.tar
        ls -lh postgres-exporter-arm64.tar

    - name: Upload tar file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: postgres-exporter-arm64
        path: postgres-exporter-arm64.tar
        compression-level: 0
