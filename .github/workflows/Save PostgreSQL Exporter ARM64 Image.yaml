name: Build openGauss-exporter Image for ARM64

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      dbmind_branch:
        description: 'DBMind分支 (master/v3.0.x/v5.0.x)'
        required: true
        default: 'master'
        type: string

env:
  IMAGE_NAME: opengauss-exporter
  TARGET_ARCH: linux/arm64

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      # 注意：不要指定 path，让代码检出到根目录

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Validate DBMind branch
      run: |
        echo "=== 验证DBMind分支存在性 ==="
        BRANCH="${{ github.event.inputs.dbmind_branch }}"
        git ls-remote --heads https://gitee.com/opengauss/openGauss-DBMind.git ${BRANCH} | grep -q ${BRANCH} || {
          echo "❌ 分支 ${BRANCH} 不存在"
          exit 1
        }
        echo "✅ 分支 ${BRANCH} 存在"

    - name: Build openGauss-exporter for ARM64
      uses: docker/build-push-action@v4
      with:
        context: .                    # ← 使用当前目录（根目录）
        file: ./Dockerfile            # ← 明确指定Dockerfile路径
        platforms: ${{ env.TARGET_ARCH }}
        tags: |
          ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
          ${{ env.IMAGE_NAME }}:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          DBMIND_BRANCH=${{ github.event.inputs.dbmind_branch }}
          EXPORTER_VERSION=${{ github.event.inputs.version }}

    - name: Save image as tar
      run: |
        mkdir -p output
        OUTPUT_FILE="output/${{ env.IMAGE_NAME }}-${{ github.event.inputs.version }}-arm64.tar"
        docker save ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }} -o ${OUTPUT_FILE}
        echo "文件: $(ls -lh output/)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMAGE_NAME }}-${{ github.event.inputs.version }}-arm64
        path: output/*.tar
        retention-days: 30
        compression-level: 0
