name: Build CES Exporter ARM64 Image with Configs

on:
  workflow_dispatch:
    inputs:
      exporter_version:
        description: 'CES Exporter 版本 (如 v2.0.3)'
        required: true
        default: 'v2.0.3'
        type: string

env:
  IMAGE_NAME: cloudeye-exporter
  IMAGE_TAG: ${{ github.event.inputs.exporter_version }}-arm64
  EXPORTER_REPO: https://github.com/huaweicloud/cloudeye-exporter.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone CES Exporter source code
        run: |
          git clone ${{ env.EXPORTER_REPO }} cloudeye-exporter-source
          cd cloudeye-exporter-source
          if [ "${{ github.event.inputs.exporter_version }}" != "latest" ]; then
            git checkout tags/${{ github.event.inputs.exporter_version }} -b build-version
          fi

      - name: Download official release package (for config files)
        run: |
          # 下载官方 Release 包（x86 架构，但配置文件通用）
          RELEASE_URL="https://github.com/huaweicloud/cloudeye-exporter/releases/download/${{ github.event.inputs.exporter_version }}/cloudeye-exporter-${{ github.event.inputs.exporter_version }}.tar.gz"
          echo "下载配置文件包: $RELEASE_URL"
          wget $RELEASE_URL -O cloudeye-exporter-release.tar.gz
          tar -xzvf cloudeye-exporter-release.tar.gz
          # 解压后进入目录（目录名通常是 cloudeye-exporter）
          ls -la

      - name: Prepare config files directory
        run: |
          # 创建配置文件目录
          mkdir -p config-files
          
          # 从解压的 Release 包中复制配置文件
          # 注意：需要根据实际解压后的目录结构调整路径
          if [ -d "cloudeye-exporter" ]; then
            cp cloudeye-exporter/clouds.yml config-files/ 2>/dev/null || true
            cp cloudeye-exporter/endpoints.yml config-files/ 2>/dev/null || true
            cp cloudeye-exporter/metric.yml config-files/ 2>/dev/null || true
            cp cloudeye-exporter/logs.yml config-files/ 2>/dev/null || true
            cp cloudeye-exporter/i18n.json config-files/ 2>/dev/null || true
            cp cloudeye-exporter/unit_standard_transform.json config-files/ 2>/dev/null || true
          else
            # 如果上述路径不对，尝试查找
            find . -name "clouds.yml" -exec cp {} config-files/ \;
            find . -name "endpoints.yml" -exec cp {} config-files/ \;
            find . -name "metric.yml" -exec cp {} config-files/ \;
          fi
          
          # 列出复制的文件
          echo "已复制的配置文件："
          ls -la config-files/

      - name: Create Dockerfile with COPY instructions
        run: |
          cat > Dockerfile << 'EOF'
          # 第一阶段：构建阶段
          FROM --platform=linux/arm64 golang:1.19-alpine AS builder

          ENV GO111MODULE=on \
              GOPROXY=https://goproxy.cn,direct \
              CGO_ENABLED=0 \
              GOOS=linux \
              GOARCH=arm64

          WORKDIR /build

          # 复制源代码并编译
          COPY cloudeye-exporter-source/ .
          RUN go mod download
          RUN go build -ldflags="-s -w" -o cloudeye-exporter .

          # 第二阶段：运行阶段
          FROM --platform=linux/arm64 alpine:latest

          # 安装必要工具
          RUN apk --no-cache add ca-certificates tzdata

          # 创建 exporter 工作目录
          RUN mkdir -p /exporter
          WORKDIR /exporter

          # 从构建阶段复制二进制文件
          COPY --from=builder /build/cloudeye-exporter /exporter/

          # ============================================
          # 关键步骤：使用 COPY 复制配置文件到镜像
          # ============================================
          # 复制所有配置文件到工作目录
          COPY config-files/clouds.yml /exporter/
          COPY config-files/endpoints.yml /exporter/
          COPY config-files/metric.yml /exporter/
          COPY config-files/logs.yml /exporter/
          # 如果有 i18n.json 和 unit_standard_transform.json 也复制
          COPY config-files/i18n.json /exporter/ 2>/dev/null || true
          COPY config-files/unit_standard_transform.json /exporter/ 2>/dev/null || true

          # 给二进制文件执行权限
          RUN chmod +x /exporter/cloudeye-exporter

          # 暴露端口
          EXPOSE 8087

          # 启动程序（直接启动，会读取同目录下的配置文件）
          ENTRYPOINT ["/exporter/cloudeye-exporter"]
          EOF

      - name: Build Docker image for ARM64
        run: |
          docker build \
            --platform linux/arm64 \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_NAME }}:latest-arm64 \
            .

      - name: Verify image architecture and files
        run: |
          # 检查架构
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | grep Architecture
          
          # 检查镜像内的配置文件
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ls -la /exporter/

      - name: Save image to tar file
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          gzip ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          sha256sum ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz > ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-arm64-image-with-configs
          path: |
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          retention-days: 7
