name: Build CES Exporter ARM64 Image

on:
  workflow_dispatch:
    inputs:
      exporter_version:
        description: 'CES Exporter 版本'
        required: true
        default: 'v2.0.31'
        type: string

env:
  IMAGE_NAME: cloudeye-exporter
  IMAGE_TAG: ${{ github.event.inputs.exporter_version }}-arm64
  EXPORTER_REPO: https://github.com/huaweicloud/cloudeye-exporter.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone source
        run: |
          git clone ${{ env.EXPORTER_REPO }} cloudeye-exporter-source
          cd cloudeye-exporter-source
          TAG="${{ github.event.inputs.exporter_version }}"
          TAG=${TAG#v}
          git checkout tags/v${TAG} -b build-version 2>/dev/null || true

      - name: Create config files
        run: |
          mkdir -p config-files
          printf '%s\n' 'global:' '  prefix: "huaweicloud"' '  scrape_batch_size: 300' '  resource_sync_interval_minutes: 180' '  ignore_ssl_verify: false' 'auth:' '  auth_url: "AUTH_URL_PLACEHOLDER"' '  project_name: "PROJECT_NAME_PLACEHOLDER"' '  access_key: ""' '  secret_key: ""' '  region: "REGION_PLACEHOLDER"' > config-files/clouds.yml
          printf '%s\n' '"ewp":' '  "https://cloudsite-internal.cn-north-4.myhuaweicloud.com"' > config-files/endpoints.yml
          printf '%s\n' 'business:' '  - level: "error"' '    type: "FILE"' '    filename: "./server.log"' '    time_format: "2006-01-02 15:04:05 Z07:00"' '    max_size: 20480000' '    max_backups: 20' '    max_age: 30' '    enabled: true' '    commpress: true' > config-files/logs.yml
          echo '# metric configuration' > config-files/metric.yml

      - name: Build image
        run: docker build --platform linux/arm64 -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -t ${{ env.IMAGE_NAME }}:latest-arm64 .

      - name: Save to tar
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          gzip ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          sha256sum ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz > ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}
          path: |
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          retention-days: 7
