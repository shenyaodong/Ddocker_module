name: Build CES Exporter ARM64 Image

on:
  workflow_dispatch:
    inputs:
      exporter_version:
        description: 'CES Exporter 版本 (如 v2.0.31)'
        required: true
        default: 'v2.0.31'
        type: string

env:
  IMAGE_NAME: cloudeye-exporter
  IMAGE_TAG: ${{ github.event.inputs.exporter_version }}-arm64
  EXPORTER_REPO: https://github.com/huaweicloud/cloudeye-exporter.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone CES Exporter source code
        run: |
          git clone ${{ env.EXPORTER_REPO }} cloudeye-exporter-source
          cd cloudeye-exporter-source
          if [ "${{ github.event.inputs.exporter_version }}" != "latest" ]; then
            TAG_VERSION="${{ github.event.inputs.exporter_version }}"
            TAG_VERSION=${TAG_VERSION#v}
            git checkout tags/v${TAG_VERSION} -b build-version
          fi
          echo "源码目录内容："
          ls -la

      - name: Generate config files (all placeholders)
        run: |
          mkdir -p config-files
          
          # ============================================
          # 1. clouds.yml - 全部使用占位符
          # ============================================
          cat > config-files/clouds.yml << 'EOF'
global:
  prefix: "huaweicloud"
  scrape_batch_size: 300
  resource_sync_interval_minutes: 180
  ignore_ssl_verify: false
  proxy_schema: ""
  proxy_host: ""
  proxy_port: 0
  proxy_username: ""
  proxy_password: ""
  rms_retry_times: 1
auth:
  auth_url: "AUTH_URL_PLACEHOLDER"
  project_name: "PROJECT_NAME_PLACEHOLDER"
  access_key: ""
  secret_key: ""
  region: "REGION_PLACEHOLDER"
  oidc:
    id_token_file_path: ""
    idp_id: ""
    domain_id: ""
EOF
          
          # ============================================
          # 2. endpoints.yml
          # ============================================
          cat > config-files/endpoints.yml << 'EOF'
"ewp":
  "https://cloudsite-internal.cn-north-4.myhuaweicloud.com"
EOF
          
          # ============================================
          # 3. logs.yml
          # ============================================
          cat > config-files/logs.yml << 'EOF'
business:
  - level: "error"
    type: "FILE"
    filename: "./server.log"
    time_format: "2006-01-02 15:04:05 Z07:00"
    max_size: 20480000
    max_backups: 20
    max_age: 30
    enabled: true
    commpress: true
EOF
          
          # ============================================
          # 4. metric.yml（从源码复制）
          # ============================================
          if [ -f "cloudeye-exporter-source/metric.yml" ]; then
            cp cloudeye-exporter-source/metric.yml config-files/
          else
            echo '# metric configuration' > config-files/metric.yml
          fi
          
          # ============================================
          # 5. 复制 JSON 配置文件
          # ============================================
          cp cloudeye-exporter-source/*.json config-files/ 2>/dev/null || true
          
          echo "=== 生成的配置文件 ==="
          ls -la config-files/
          echo ""
          echo "=== clouds.yml 内容（全部占位符）==="
          cat config-files/clouds.yml

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'DOCKER_EOF'
          # 第一阶段：构建阶段
          FROM --platform=linux/arm64 golang:1.19-alpine AS builder

          ENV GO111MODULE=on \
              GOPROXY=https://goproxy.cn,direct \
              CGO_ENABLED=0 \
              GOOS=linux \
              GOARCH=arm64

          WORKDIR /build

          # 复制源代码并编译
          COPY cloudeye-exporter-source/ .
          RUN go mod download
          RUN go build -ldflags="-s -w" -o cloudeye-exporter .

          # 第二阶段：运行阶段
          FROM --platform=linux/arm64 alpine:latest

          # 安装必要工具
          RUN apk --no-cache add ca-certificates tzdata sed

          # 创建 exporter 工作目录
          RUN mkdir -p /exporter
          WORKDIR /exporter

          # 从构建阶段复制二进制文件
          COPY --from=builder /build/cloudeye-exporter /exporter/

          # 复制所有配置文件到镜像
          COPY config-files/ /exporter/

          # 给二进制文件执行权限
          RUN chmod +x /exporter/cloudeye-exporter

          # 暴露端口
          EXPOSE 8080

          # 使用启动脚本（运行时替换占位符）
          COPY --chmod=755 <<'START_SCRIPT' /exporter/start.sh
#!/bin/sh
# 替换 clouds.yml 中的占位符
if [ -n "$AUTH_URL" ]; then
    sed -i "s|AUTH_URL_PLACEHOLDER|$AUTH_URL|g" /exporter/clouds.yml
fi
if [ -n "$PROJECT_NAME" ]; then
    sed -i "s|PROJECT_NAME_PLACEHOLDER|$PROJECT_NAME|g" /exporter/clouds.yml
fi
if [ -n "$REGION" ]; then
    sed -i "s|REGION_PLACEHOLDER|$REGION|g" /exporter/clouds.yml
fi
if [ -n "$HUAWEI_CLOUD_AK" ]; then
    sed -i "s|access_key: \"\"|access_key: \"$HUAWEI_CLOUD_AK\"|" /exporter/clouds.yml
fi
if [ -n "$HUAWEI_CLOUD_SK" ]; then
    sed -i "s|secret_key: \"\"|secret_key: \"$HUAWEI_CLOUD_SK\"|" /exporter/clouds.yml
fi
# 启动 exporter
exec /exporter/cloudeye-exporter "$@"
START_SCRIPT

          ENTRYPOINT ["/exporter/start.sh"]
          DOCKER_EOF

      - name: Build Docker image for ARM64
        run: |
          docker build \
            --platform linux/arm64 \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_NAME }}:latest-arm64 \
            .

      - name: Verify image contents
        run: |
          echo "=== 验证镜像内容 ==="
          docker run --rm --entrypoint ls ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -la /exporter/
          echo ""
          echo "=== 检查关键文件 ==="
          for file in cloudeye-exporter clouds.yml logs.yml endpoints.yml metric.yml start.sh; do
            if docker run --rm --entrypoint test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f "/exporter/$file"; then
              echo "✓ $file 存在"
            else
              echo "✗ $file 缺失"
            fi
          done
          echo ""
          echo "=== 验证占位符 ==="
          docker run --rm --entrypoint cat ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} /exporter/clouds.yml

      - name: Save image to tar file
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          gzip ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          sha256sum ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz > ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          echo "生成的文件："
          ls -lh *.tar.gz*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-arm64-image
          path: |
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          retention-days: 7
          compression-level: 0
