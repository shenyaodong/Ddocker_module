name: Build openGauss-exporter Image for ARM64

on:
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本标签 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      dbmind_branch:
        description: 'DBMind分支 (master/v3.0.x/v5.0.x)'
        required: true
        default: 'master'
        type: string

env:
  IMAGE_NAME: opengauss-exporter
  TARGET_ARCH: linux/arm64

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Validate DBMind branch
      run: |
        echo "=== 验证DBMind分支存在性 ==="
        BRANCH="${{ github.event.inputs.dbmind_branch }}"
        git ls-remote --heads https://gitee.com/opengauss/openGauss-DBMind.git ${BRANCH} | grep -q ${BRANCH} || {
          echo "❌ 分支 ${BRANCH} 不存在"
          exit 1
        }
        echo "✅ 分支 ${BRANCH} 存在"

    - name: Prepare config files
      run: |
        # 创建配置文件目录
        mkdir -p config-files
        
        # 创建默认配置文件（从源码获取或使用默认值）
        # 注意：这里需要根据你的实际需求填写正确的内容
        
        # clouds.yml
        cat > config-files/clouds.yml << 'EOF'
global:
  port: "8080"
  scrape_batch_size: 300
  resource_sync_interval_minutes: 180
  ignore_ssl_verify: true
auth:
  auth_url: "https://iam.xxx.myhuaweicloud.com/v3"
  region: "cn-north-4"
  project_name: "cn-north-4"
  access_key: ""
  secret_key: ""
EOF
        
        # logs.yml
        cat > config-files/logs.yml << 'EOF'
level: info
encoding: console
outputPaths:
  - stdout
errorOutputPaths:
  - stderr
EOF
        
        # metric.yml（空文件或基础配置）
        echo "# metric configuration" > config-files/metric.yml
        
        # endpoints.yml（空文件或基础配置）
        echo "# endpoints configuration" > config-files/endpoints.yml
        
        echo "配置文件已创建："
        ls -la config-files/

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        platforms: ${{ env.TARGET_ARCH }}
        tags: |
          ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }}
          ${{ env.IMAGE_NAME }}:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          DBMIND_BRANCH=${{ github.event.inputs.dbmind_branch }}
          EXPORTER_VERSION=${{ github.event.inputs.version }}

    - name: Verify image contents
      run: |
        echo "=== 验证镜像内容 ==="
        docker run --rm ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }} ls -la /exporter/
        docker run --rm ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }} ls -la /exporter/clouds.yml || echo "clouds.yml 不存在"

    - name: Save image as tar
      run: |
        mkdir -p output
        OUTPUT_FILE="output/${{ env.IMAGE_NAME }}-${{ github.event.inputs.version }}-arm64.tar"
        docker save ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version }} -o ${OUTPUT_FILE}
        echo "生成文件: $(ls -lh output/)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.IMAGE_NAME }}-${{ github.event.inputs.version }}-arm64
        path: output/*.tar
        retention-days: 30
        compression-level: 0
