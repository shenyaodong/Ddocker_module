name: Build CES Exporter ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source
        run: |
          git clone https://github.com/huaweicloud/cloudeye-exporter.git
          cd cloudeye-exporter
          git checkout $(git describe --tags $(git rev-list --tags --max-count=1))

      - name: Apply nil pointer fix
        run: |
          chmod +x fix-nil-pointer.sh
          ./fix-nil-pointer.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        working-directory: ./cloudeye-exporter
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o cloudeye-exporter main.go

      - name: Package image
        working-directory: ./cloudeye-exporter
        run: |
          echo "FROM alpine:3.19" > Dockerfile
          echo "COPY cloudeye-exporter /usr/local/bin/" >> Dockerfile
          echo "EXPOSE 8080" >> Dockerfile
          echo "ENTRYPOINT [\"/usr/local/bin/cloudeye-exporter\"]" >> Dockerfile
          docker build -t ces-exporter:arm64 .
          docker save ces-exporter:arm64 | gzip > ces-exporter-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ces-exporter-arm64
          path: ./cloudeye-exporter/ces-exporter-arm64.tar.gz
