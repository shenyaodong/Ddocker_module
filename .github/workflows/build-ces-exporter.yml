name: Build CES Exporter ARM64 Image with Configs

on:
  workflow_dispatch:
    inputs:
      exporter_version:
        description: 'CES Exporter 版本 (如 v2.0.31)'
        required: true
        default: 'v2.0.31'
        type: string

env:
  IMAGE_NAME: cloudeye-exporter
  IMAGE_TAG: ${{ github.event.inputs.exporter_version }}-arm64
  EXPORTER_REPO: https://github.com/huaweicloud/cloudeye-exporter.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone CES Exporter source code
        run: |
          git clone ${{ env.EXPORTER_REPO }} cloudeye-exporter-source
          cd cloudeye-exporter-source
          if [ "${{ github.event.inputs.exporter_version }}" != "latest" ]; then
            TAG_VERSION="${{ github.event.inputs.exporter_version }}"
            TAG_VERSION=${TAG_VERSION#v}
            git checkout tags/v${TAG_VERSION} -b build-version
          fi
          echo "源码目录内容："
          ls -la

      - name: Prepare config files from source code
        run: |
          # 创建配置文件目录
          mkdir -p config-files
          
          # 配置文件就在源码根目录下，直接复制
          echo "从源码复制配置文件..."
          cp cloudeye-exporter-source/clouds.yml config-files/ 2>/dev/null || true
          cp cloudeye-exporter-source/endpoints.yml config-files/ 2>/dev/null || true
          cp cloudeye-exporter-source/metric.yml config-files/ 2>/dev/null || true
          cp cloudeye-exporter-source/logs.yml config-files/ 2>/dev/null || true
          cp cloudeye-exporter-source/*.json config-files/ 2>/dev/null || true
          
          echo "已复制的配置文件："
          ls -la config-files/
          
          # 验证关键配置文件是否存在
          if [ ! -f config-files/clouds.yml ]; then
            echo "警告：在源码中未找到 clouds.yml 配置文件，将创建默认配置"
            
            # 使用 printf 代替 heredoc 避免 YAML 解析问题
            printf '%s\n' \
              'global:' \
              '  port: ":8087"' \
              '  scrape_batch_size: 300' \
              '  resource_sync_interval_minutes: 180' \
              '  ignore_ssl_verify: false' \
              'auth:' \
              '  auth_url: "https://iam.{region_id}.myhuaweicloud.com/v3"' \
              '  project_name: "cn-north-1"' \
              '  region: "cn-north-1"' \
              '  access_key: ""' \
              '  secret_key: ""' > config-files/clouds.yml
          fi

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'DOCKER_EOF'
          # 第一阶段：构建阶段
          FROM --platform=linux/arm64 golang:1.19-alpine AS builder

          ENV GO111MODULE=on \
              GOPROXY=https://goproxy.cn,direct \
              CGO_ENABLED=0 \
              GOOS=linux \
              GOARCH=arm64

          WORKDIR /build

          # 复制源代码并编译
          COPY cloudeye-exporter-source/ .
          RUN go mod download
          RUN go build -ldflags="-s -w" -o cloudeye-exporter .

          # 第二阶段：运行阶段
          FROM --platform=linux/arm64 alpine:latest

          # 安装必要工具
          RUN apk --no-cache add ca-certificates tzdata

          # 创建 exporter 工作目录
          RUN mkdir -p /exporter
          WORKDIR /exporter

          # 从构建阶段复制二进制文件
          COPY --from=builder /build/cloudeye-exporter /exporter/

          # 从源码复制配置文件到镜像
          COPY config-files/clouds.yml /exporter/
          COPY config-files/endpoints.yml /exporter/ 2>/dev/null || true
          COPY config-files/metric.yml /exporter/ 2>/dev/null || true
          COPY config-files/logs.yml /exporter/ 2>/dev/null || true
          COPY config-files/*.json /exporter/ 2>/dev/null || true

          # 给二进制文件执行权限
          RUN chmod +x /exporter/cloudeye-exporter

          # 暴露端口
          EXPOSE 8087

          # 启动程序
          ENTRYPOINT ["/exporter/cloudeye-exporter"]
          DOCKER_EOF

      - name: Build Docker image for ARM64
        run: |
          docker build \
            --platform linux/arm64 \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_NAME }}:latest-arm64 \
            .

      - name: Verify image architecture and files
        run: |
          echo "镜像架构："
          docker inspect ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | grep Architecture
          
          echo "镜像内的 /exporter 目录内容："
          docker run --rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ls -la /exporter/

      - name: Save image to tar file
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          gzip ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          sha256sum ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz > ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          
          echo "生成的文件："
          ls -lh *.tar.gz*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-arm64-image-with-configs
          path: |
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          retention-days: 7
          compression-level: 0

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
