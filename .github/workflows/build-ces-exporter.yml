name: Pull ARM64 Image

on:
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Pull ARM64 image
        run: |
          docker pull --platform linux/arm64 telkomindonesia/hwc-cloudeye-exporter:latest

      - name: Save image
        run: |
          docker save telkomindonesia/hwc-cloudeye-exporter:latest -o image.tar
          gzip image.tar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ces-exporter-arm64
          path: image.tar.gz
