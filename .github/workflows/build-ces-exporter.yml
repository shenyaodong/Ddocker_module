name: Build CES Exporter ARM64 Image

on:
  workflow_dispatch:
    inputs:
      exporter_version:
        description: 'CES Exporter 版本 (如 v2.0.31)'
        required: true
        default: 'v2.0.31'
        type: string

env:
  IMAGE_NAME: cloudeye-exporter
  IMAGE_TAG: ${{ github.event.inputs.exporter_version }}-arm64
  EXPORTER_REPO: https://github.com/huaweicloud/cloudeye-exporter.git

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone CES Exporter source code
        run: |
          git clone ${{ env.EXPORTER_REPO }} cloudeye-exporter-source
          cd cloudeye-exporter-source
          if [ "${{ github.event.inputs.exporter_version }}" != "latest" ]; then
            TAG_VERSION="${{ github.event.inputs.exporter_version }}"
            TAG_VERSION=${TAG_VERSION#v}
            git checkout tags/v${TAG_VERSION} -b build-version
          fi

      - name: Generate config files
        run: |
          mkdir -p config-files
          
          cat > config-files/clouds.yml << 'EOF'
global:
  prefix: "huaweicloud"
  scrape_batch_size: 300
  resource_sync_interval_minutes: 180
  ignore_ssl_verify: false
auth:
  auth_url: "AUTH_URL_PLACEHOLDER"
  project_name: "PROJECT_NAME_PLACEHOLDER"
  access_key: ""
  secret_key: ""
  region: "REGION_PLACEHOLDER"
EOF
          
          cat > config-files/endpoints.yml << 'EOF'
"ewp":
  "https://cloudsite-internal.cn-north-4.myhuaweicloud.com"
EOF
          
          cat > config-files/logs.yml << 'EOF'
business:
  - level: "error"
    type: "FILE"
    filename: "./server.log"
    time_format: "2006-01-02 15:04:05 Z07:00"
    max_size: 20480000
    max_backups: 20
    max_age: 30
    enabled: true
    commpress: true
EOF
          
          echo '# metric configuration' > config-files/metric.yml
          # 复制源码中的 JSON 文件（如果存在）
          cp cloudeye-exporter-source/*.json config-files/ 2>/dev/null || true
          
          ls -la config-files/

      - name: Create entrypoint script
        run: |
          cat > start.sh << 'EOF'
          #!/bin/sh
          set -e
          # Replace placeholders
          [ -n "$AUTH_URL" ] && sed -i "s|AUTH_URL_PLACEHOLDER|$AUTH_URL|g" /exporter/clouds.yml
          [ -n "$PROJECT_NAME" ] && sed -i "s|PROJECT_NAME_PLACEHOLDER|$PROJECT_NAME|g" /exporter/clouds.yml
          [ -n "$REGION" ] && sed -i "s|REGION_PLACEHOLDER|$REGION|g" /exporter/clouds.yml
          [ -n "$HUAWEI_CLOUD_AK" ] && sed -i 's|access_key: ""|access_key: "'"$HUAWEI_CLOUD_AK"'"|' /exporter/clouds.yml
          [ -n "$HUAWEI_CLOUD_SK" ] && sed -i 's|secret_key: ""|secret_key: "'"$HUAWEI_CLOUD_SK"'"|' /exporter/clouds.yml
          exec /exporter/cloudeye-exporter "$@"
          EOF
          chmod +x start.sh

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/arm64 \
            -f - . << 'DOCKER_EOF'
          FROM --platform=linux/arm64 golang:1.19-alpine AS builder
          ENV GO111MODULE=on GOPROXY=https://goproxy.cn,direct CGO_ENABLED=0 GOOS=linux GOARCH=arm64
          WORKDIR /build
          COPY cloudeye-exporter-source/ .
          RUN go mod download
          RUN go build -ldflags="-s -w" -o cloudeye-exporter

          FROM --platform=linux/arm64 alpine:latest
          RUN apk --no-cache add ca-certificates tzdata sed
          RUN mkdir -p /exporter
          WORKDIR /exporter

          COPY --from=builder /build/cloudeye-exporter /exporter/
          COPY config-files/ /exporter/
          COPY start.sh /exporter/start.sh

          RUN chmod +x /exporter/cloudeye-exporter && \
              chmod 755 /exporter/start.sh && \
              chmod 666 /exporter/clouds.yml && \
              chmod 666 /exporter/logs.yml && \
              chmod 666 /exporter/endpoints.yml && \
              chmod 666 /exporter/metric.yml

          EXPOSE 8080
          ENTRYPOINT ["/exporter/start.sh"]
          DOCKER_EOF
          docker tag ${{ env.IMAGE_NAME }} ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Save image to tar file
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          gzip ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          sha256sum ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz > ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}
          path: |
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          retention-days: 7
          compression-level: 0
