name: Build CES Exporter ARM64 Image

on:
  workflow_dispatch:
    inputs:
      exporter_version:
        description: 'CES Exporter 版本 (如 v2.0.31)'
        required: true
        default: 'v2.0.31'
        type: string
      region:
        description: '华为云区域'
        required: true
        default: 'cgo-e-01'
        type: string
      project_name:
        description: '项目名称'
        required: true
        default: 'cgo-e-01'
        type: string

env:
  IMAGE_NAME: cloudeye-exporter
  IMAGE_TAG: ${{ github.event.inputs.exporter_version }}-arm64
  EXPORTER_REPO: https://github.com/huaweicloud/cloudeye-exporter.git
  REGION: ${{ github.event.inputs.region }}
  PROJECT_NAME: ${{ github.event.inputs.project_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clone CES Exporter source code
        run: |
          git clone ${{ env.EXPORTER_REPO }} cloudeye-exporter-source
          cd cloudeye-exporter-source
          if [ "${{ github.event.inputs.exporter_version }}" != "latest" ]; then
            TAG_VERSION="${{ github.event.inputs.exporter_version }}"
            TAG_VERSION=${TAG_VERSION#v}
            git checkout tags/v${TAG_VERSION} -b build-version
          fi
          echo "源码目录内容："
          ls -la

      - name: Generate config files (without AK/SK)
        run: |
          mkdir -p config-files
          
          # clouds.yml - AK/SK 留空，运行时通过 Secret 注入
          printf '%s\n' \
            'global:' \
            '  port: "8080"' \
            '  scrape_batch_size: 300' \
            '  resource_sync_interval_minutes: 180' \
            '  ignore_ssl_verify: true' \
            'auth:' \
            '  auth_url: "https://iam-apigateway-proxy.xclouda.xfusion.com/v3"' \
            '  region: "'${{ env.REGION }}'"' \
            '  project_name: "'${{ env.PROJECT_NAME }}'"' \
            '  access_key: ""' \
            '  secret_key: ""' > config-files/clouds.yml
          
          # logs.yml
          printf '%s\n' \
            'level: info' \
            'encoding: console' \
            'outputPaths:' \
            '  - stdout' \
            'errorOutputPaths:' \
            '  - stderr' > config-files/logs.yml
          
          # metric.yml
          if [ -f "cloudeye-exporter-source/metric.yml" ]; then
            cp cloudeye-exporter-source/metric.yml config-files/
          else
            printf '%s\n' '# metric configuration' > config-files/metric.yml
          fi
          
          # endpoints.yml
          if [ -f "cloudeye-exporter-source/endpoints.yml" ]; then
            cp cloudeye-exporter-source/endpoints.yml config-files/
          else
            printf '%s\n' '# endpoints configuration' > config-files/endpoints.yml
          fi
          
          # 复制 JSON 配置文件（如果存在）
          cp cloudeye-exporter-source/*.json config-files/ 2>/dev/null || true
          
          echo "=== 生成的配置文件 ==="
          ls -la config-files/
          echo "=== clouds.yml 内容（AK/SK 已留空）==="
          cat config-files/clouds.yml

      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'DOCKER_EOF'
          # 第一阶段：构建阶段
          FROM --platform=linux/arm64 golang:1.19-alpine AS builder

          ENV GO111MODULE=on \
              GOPROXY=https://goproxy.cn,direct \
              CGO_ENABLED=0 \
              GOOS=linux \
              GOARCH=arm64

          WORKDIR /build

          # 复制源代码并编译
          COPY cloudeye-exporter-source/ .
          RUN go mod download
          RUN go build -ldflags="-s -w" -o cloudeye-exporter .

          # 第二阶段：运行阶段
          FROM --platform=linux/arm64 alpine:latest

          # 安装必要工具和 ca-certificates
          RUN apk --no-cache add ca-certificates tzdata

          # 创建 exporter 工作目录
          RUN mkdir -p /exporter
          WORKDIR /exporter

          # 从构建阶段复制二进制文件
          COPY --from=builder /build/cloudeye-exporter /exporter/

          # 复制所有配置文件
          COPY config-files/ /exporter/

          # 给二进制文件执行权限
          RUN chmod +x /exporter/cloudeye-exporter

          # 暴露端口
          EXPOSE 8080

          # 启动程序（AK/SK 通过启动脚本传入，不在镜像中）
          ENTRYPOINT ["/exporter/cloudeye-exporter"]
          DOCKER_EOF

      - name: Build Docker image for ARM64
        run: |
          docker build \
            --platform linux/arm64 \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            -t ${{ env.IMAGE_NAME }}:latest-arm64 \
            .

      - name: Verify image contents
        run: |
          echo "=== 验证镜像内容 ==="
          docker run --rm --entrypoint ls ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -la /exporter/
          echo ""
          echo "=== 检查关键文件 ==="
          docker run --rm --entrypoint test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f /exporter/clouds.yml && echo "✓ clouds.yml 存在" || echo "✗ clouds.yml 缺失"
          docker run --rm --entrypoint test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f /exporter/logs.yml && echo "✓ logs.yml 存在" || echo "✗ logs.yml 缺失"
          docker run --rm --entrypoint test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f /exporter/cloudeye-exporter && echo "✓ 二进制文件存在" || echo "✗ 二进制文件缺失"
          echo ""
          echo "=== 验证 AK/SK 未写入镜像 ==="
          docker run --rm --entrypoint cat ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} /exporter/clouds.yml | grep -E "access_key|secret_key"

      - name: Save image to tar file
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          gzip ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar
          sha256sum ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz > ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          echo "生成的文件："
          ls -lh *.tar.gz*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-arm64-image
          path: |
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz
            ${{ env.IMAGE_NAME }}-${{ env.IMAGE_TAG }}.tar.gz.sha256
          retention-days: 7
          compression-level: 0
