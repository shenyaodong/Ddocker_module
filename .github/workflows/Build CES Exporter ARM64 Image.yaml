name: Build Cloudeye Exporter (ARM64, metric enabled)

on:
  workflow_dispatch:

env:
  IMAGE_NAME: cloudeye-exporter
  IMAGE_TAG: metric-arm64
  REGISTRY: swr.cgo-e-01.xclouda.xfusion.com
  NAMESPACE: erp-image-ver

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # =====================================================
    # 1. Clone official cloudeye-exporter
    # =====================================================
    - name: Clone cloudeye-exporter source
      run: |
        git clone https://github.com/huaweicloud/cloudeye-exporter.git
        cd cloudeye-exporter
        echo "Current commit:"
        git log -1 --oneline

    # =====================================================
    # 2. Patch logger panic (critical fix)
    # =====================================================
    - name: Patch logger nil panic
      working-directory: ./cloudeye-exporter
      run: |
        set -e
        sed -i 's/panic("logger is nil")/fmt.Printf("[ERROR] "+format+"\\n", v...); return/' logs/logs.go
        grep -n "fmt.Printf" logs/logs.go

    # =====================================================
    # 3. Verify metric flag support (fail fast)
    # =====================================================
    - name: Verify -metric flag exists
      working-directory: ./cloudeye-exporter
      run: |
        if ! grep -R "flag.*metric" -n main.go; then
          echo "ERROR: -metric flag not found in source code"
          exit 1
        fi
        echo "OK: -metric flag found"

    # =====================================================
    # 4. Setup Go
    # =====================================================
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # =====================================================
    # 5. Build ARM64 binary
    # =====================================================
    - name: Build ARM64 binary
      working-directory: ./cloudeye-exporter
      run: |
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -ldflags="-s -w" \
          -o cloudeye-exporter main.go
        file cloudeye-exporter

    # =====================================================
    # 6. Validate binary supports -metric (runtime check)
    # =====================================================
    - name: Validate -metric flag at runtime
      working-directory: ./cloudeye-exporter
      run: |
        ./cloudeye-exporter -h | grep -- "-metric"

    # =====================================================
    # 7. Create Dockerfile
    # =====================================================
    - name: Create Dockerfile
      working-directory: ./cloudeye-exporter
      run: |
        cat > Dockerfile << 'EOF'
        FROM arm64v8/alpine:3.19
        RUN apk add --no-cache ca-certificates tzdata
        WORKDIR /app
        COPY cloudeye-exporter /app/cloudeye-exporter
        EXPOSE 8080
        ENTRYPOINT ["/app/cloudeye-exporter"]
        EOF

    # =====================================================
    # 8. Setup QEMU
    # =====================================================
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # =====================================================
    # 9. Setup Docker Buildx
    # =====================================================
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # =====================================================
    # 10. Login to SWR
    # =====================================================
    - name: Login to SWR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}

    # =====================================================
    # 11. Build & Push ARM64 image
    # =====================================================
    - name: Build and push image
      run: |
        docker buildx build \
          --platform linux/arm64 \
          -t $REGISTRY/$NAMESPACE/$IMAGE_NAME:$IMAGE_TAG \
          --push \
          ./cloudeye-exporter

