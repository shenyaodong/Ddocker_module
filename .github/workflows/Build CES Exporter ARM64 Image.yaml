name: Build CES Exporter ARM64 (Latest Release)

on:
  workflow_dispatch:

env:
  IMAGE_NAME: cloudeye-exporter
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # =====================================================
    # 1. 获取最新 Release Tag
    # =====================================================
    - name: Get latest release tag
      id: release
      run: |
        TAG=$(curl -s https://api.github.com/repos/huaweicloud/cloudeye-exporter/releases/latest \
          | grep tag_name | cut -d '"' -f4)
        echo "Using release: $TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    # =====================================================
    # 2. Clone cloudeye-exporter (最新 Release)
    # =====================================================
    - name: Clone cloudeye-exporter
      run: |
        git clone https://github.com/huaweicloud/cloudeye-exporter.git
        cd cloudeye-exporter
        git checkout ${{ steps.release.outputs.tag }}
        echo "=== Latest commit ==="
        git log -1 --oneline

    # =====================================================
    # 3. Setup Go
    # =====================================================
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # =====================================================
    # 4. Build ARM64 binary
    # =====================================================
    - name: Build ARM64 binary
      working-directory: ./cloudeye-exporter
      run: |
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -ldflags="-s -w" \
          -o cloudeye-exporter main.go
        file cloudeye-exporter
        ls -lh cloudeye-exporter

    # =====================================================
    # 5. 创建配置文件模板
    # =====================================================
    - name: Create config files
      working-directory: ./cloudeye-exporter
      run: |
        # 创建 clouds.yml 配置模板
        cat > clouds.yml << 'EOF'
        global:
          port: 8080
          # 可选：指定 metric.yml 路径（如果放在同目录可省略）
          # metrics_conf_path: "/app/metric.yml"
        
        auth:
          auth_url: "https://iam.{region}.myhuaweicloud.com/v3"
          project_name: "{your_project_name}"
          access_key: ""
          secret_key: ""
          region: "{your_region}"
        
        services:
          - service: "SYS.ECS"
            resources:
              - "instance_id"
          - service: "SYS.GAUSSDBV5"
            resources:
              - "gaussdb_instance_id"
          - service: "SYS.MRS"
            resources:
              - "cluster_id"
          - service: "SYS.DCS"
            resources:
              - "dcs_instance_id"
          - service: "SYS.ELB"
            resources:
              - "loadbalancer_id"
          - service: "SYS.ROMA"
            resources:
              - "instance_id"
              - "kafka_instance_id,kafka_broker"
        EOF
        
        # 创建 metric.yml 指标筛选模板
        cat > metric.yml << 'EOF'
        metrics:
          - namespace: SYS.GAUSSDBV5
            metric_name:
              - "cpu_usage"
              - "mem_usage"
              - "conn_count"
              - "qps"
              - "tps"
              - "slow_queries"
              - "deadlock_count"
          
          - namespace: SYS.ECS
            metric_name:
              - "cpu_util"
              - "mem_util"
              - "disk_read_bytes_rate"
              - "disk_write_bytes_rate"
              - "network_incoming_bytes_rate"
              - "network_outgoing_bytes_rate"
          
          - namespace: SYS.MRS
            metric_name:
              - "cpu_usage"
              - "mem_usage"
              - "disk_usage"
              - "load_average_1m"
              - "hdfs_used_capacity"
              - "hdfs_total_capacity"
              - "yarn_apps_running"
              - "yarn_apps_pending"
          
          - namespace: SYS.DCS
            metric_name:
              - "cpu_usage"
              - "mem_usage"
              - "connected_clients"
              - "used_memory"
              - "hit_rate"
          
          - namespace: SYS.ELB
            metric_name:
              - "active_connections"
              - "request_count"
              - "response_time"
              - "http_code_4xx"
              - "http_code_5xx"
          
          - namespace: SYS.ROMA
            metric_name:
              - "current_partitions"
              - "current_topics"
              - "group_msgs"
              - "broker_data_size"
              - "broker_messages_in_rate"
              - "broker_cpu_usage"
              - "broker_disk_usage"
              - "broker_alive"
        EOF
        
        echo "=== Config files created ==="
        ls -la *.yml

    # =====================================================
    # 6. 创建 Dockerfile
    # =====================================================
    - name: Create Dockerfile
      working-directory: ./cloudeye-exporter
      run: |
        cat > Dockerfile << 'EOF'
        FROM arm64v8/alpine:3.19
        
        RUN apk add --no-cache ca-certificates tzdata
        
        WORKDIR /app
        
        # 复制二进制文件
        COPY cloudeye-exporter /app/cloudeye-exporter
        
        # 复制配置文件模板
        COPY clouds.yml /app/clouds.yml.example
        COPY metric.yml /app/metric.yml.example
        
        # 创建数据目录
        RUN mkdir -p /app/logs
        
        RUN chmod +x /app/cloudeye-exporter
        
        EXPOSE 8080
        
        # 使用环境变量替换配置文件中的占位符
        ENTRYPOINT ["/app/cloudeye-exporter"]
        CMD ["--config=/app/clouds.yml"]
        EOF
        
        cat Dockerfile

    # =====================================================
    # 7. 设置 QEMU（用于模拟 ARM64 架构）
    # =====================================================
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # =====================================================
    # 8. 设置 Docker Buildx
    # =====================================================
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # =====================================================
    # 9. 构建 ARM64 镜像（仅本地，不推送）
    # =====================================================
    - name: Build ARM64 image
      run: |
        docker buildx build \
          --platform linux/arm64 \
          --load \
          -t ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}-arm64 \
          ./cloudeye-exporter
        docker images | grep cloudeye-exporter

    # =====================================================
    # 10. 导出镜像为 tar 文件
    # =====================================================
    - name: Save image as tar
      run: |
        TAR_NAME=${{ env.IMAGE_NAME }}-${{ steps.release.outputs.tag }}-arm64.tar
        docker save ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}-arm64 -o $TAR_NAME
        echo "=== Image saved ==="
        ls -lh $TAR_NAME
        echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

    # =====================================================
    # 11. 上传 tar 文件作为 Artifact
    # =====================================================
    - name: Upload image tar
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-${{ steps.release.outputs.tag }}-arm64
        path: ${{ env.TAR_NAME }}
        compression-level: 0

    # =====================================================
    # 12. 可选：同时上传二进制文件
    # =====================================================
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-${{ steps.release.outputs.tag }}-arm64-binary
        path: ./cloudeye-exporter/cloudeye-exporter
