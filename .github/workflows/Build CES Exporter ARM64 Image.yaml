name: Build CES Exporter ARM64 (Patched)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Specify version (leave empty for latest release)'
        required: false
        default: ''
        type: string

env:
  IMAGE_NAME: cloudeye-exporter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version info
        id: version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            TAG=$(curl -s https://api.github.com/repos/huaweicloud/cloudeye-exporter/releases/latest \
              | grep tag_name | cut -d '"' -f4)
            echo "Using latest release: $TAG"
          else
            TAG="${{ github.event.inputs.version }}"
            echo "Using specified version: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Clone cloudeye-exporter
        run: |
          git clone https://github.com/huaweicloud/cloudeye-exporter.git
          cd cloudeye-exporter
          git checkout ${{ steps.version.outputs.tag }}
          echo "Current commit:"
          git log -1 --oneline

      - name: Debug - Show file structure
        working-directory: ./cloudeye-exporter
        run: |
          echo "=== Files in logs directory ==="
          ls -la logs/
          echo ""
          echo "=== First 30 lines of logs/logs.go ==="
          head -30 logs/logs.go
          echo ""
          echo "=== Search for Errorf ==="
          grep -n "Errorf" logs/logs.go || echo "No Errorf found"

      - name: Patch logs.go with Python
        working-directory: ./cloudeye-exporter
        run: |
          python3 << 'PYTHON_PATCH'
          import re
          import sys
          
          try:
              with open('logs/logs.go', 'r') as f:
                  content = f.read()
              
              # 检查是否已经有补丁
              if 'if lc == nil || lc.logger == nil' in content:
                  print("Patch already applied to logs.go, skipping")
                  sys.exit(0)
              
              # 查找 Errorf 函数 - 使用更宽松的正则
              pattern = r'(func\s+\(lc\s+\*LoggerConstructor\)\s+Errorf\s*\([^)]+\)\s*\{)\s*\n'
              
              def add_check(match):
                  func_start = match.group(1)
                  return func_start + '\n    if lc == nil || lc.logger == nil {\n        fmt.Printf("[ERROR] "+format+"\\n", v...)\n        return\n    }\n'
              
              new_content = re.sub(pattern, add_check, content, flags=re.MULTILINE)
              
              if new_content == content:
                  print("Warning: Could not find Errorf function to patch")
                  sys.exit(0)
              
              # 确保导入了 fmt 包
              if 'import (' in new_content and '"fmt"' not in new_content:
                  new_content = new_content.replace('import (', 'import (\n\t"fmt"')
              
              with open('logs/logs.go', 'w') as f:
                  f.write(new_content)
              
              print("Successfully patched logs.go")
              
          except Exception as e:
              print(f"Error patching logs.go: {e}")
              sys.exit(1)
          PYTHON_PATCH

      - name: Patch main.go with Python
        working-directory: ./cloudeye-exporter
        run: |
          python3 << 'PYTHON_PATCH'
          import re
          import sys
          
          try:
              with open('main.go', 'r') as f:
                  content = f.read()
              
              # 检查是否已经有补丁
              if 'logs.InitLogger()' in content:
                  print("Patch already applied to main.go, skipping")
                  sys.exit(0)
              
              # 查找 initConf 函数并添加日志初始化
              pattern = r'(func\s+initConf\s*\(\)\s*\{)\s*\n'
              
              def add_init(match):
                  func_start = match.group(1)
                  return func_start + '\n    // Ensure logger is initialized\n    if err := logs.InitLogger(); err != nil {\n        fmt.Printf("FATAL: failed to init logger: %v\\n", err)\n        return\n    }\n'
              
              new_content = re.sub(pattern, add_init, content, flags=re.MULTILINE)
              
              if new_content == content:
                  print("Warning: Could not find initConf function to patch")
                  sys.exit(0)
              
              # 确保导入了 fmt 包
              if 'import (' in new_content and '"fmt"' not in new_content:
                  new_content = new_content.replace('import (', 'import (\n\t"fmt"')
              
              with open('main.go', 'w') as f:
                  f.write(new_content)
              
              print("Successfully patched main.go")
              
          except Exception as e:
              print(f"Error patching main.go: {e}")
              sys.exit(1)
          PYTHON_PATCH

      - name: Verify patches
        working-directory: ./cloudeye-exporter
        run: |
          echo "=== Checking logs.go patch ==="
          if grep -q "if lc == nil || lc.logger == nil" logs/logs.go; then
            echo "✓ logs.go patched successfully"
            grep -A5 "func.*Errorf" logs/logs.go | head -10
          else
            echo "⚠ logs.go patch not found, but continuing"
          fi
          
          echo ""
          echo "=== Checking main.go patch ==="
          if grep -q "logs.InitLogger()" main.go; then
            echo "✓ main.go patched successfully"
            grep -A5 "func initConf" main.go | head -10
          else
            echo "⚠ main.go patch not found, but continuing"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build ARM64 binary
        working-directory: ./cloudeye-exporter
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cloudeye-exporter main.go
          file cloudeye-exporter
          ls -lh cloudeye-exporter

      - name: Create config files
        working-directory: ./cloudeye-exporter
        run: |
          cat > clouds.yml << 'EOF'
          global:
            port: 8080
            metrics_conf_path: "/app/metric.yml"

          auth:
            auth_url: "https://iam.{region}.myhuaweicloud.com/v3"
            project_name: "{your_project_name}"
            access_key: ""
            secret_key: ""
            region: "{your_region}"

          services:
            - service: "SYS.ECS"
              resources:
                - "instance_id"
          EOF

          cat > metric.yml << 'EOF'
          metrics:
            - namespace: SYS.ECS
              metric_name:
                - "cpu_util"
                - "mem_util"
          EOF

      - name: Create Dockerfile
        working-directory: ./cloudeye-exporter
        run: |
          cat > Dockerfile << 'EOF'
          FROM arm64v8/alpine:3.19
          RUN apk add --no-cache ca-certificates tzdata
          WORKDIR /app
          COPY cloudeye-exporter /app/cloudeye-exporter
          COPY clouds.yml /app/clouds.yml
          COPY metric.yml /app/metric.yml
          RUN chmod +x /app/cloudeye-exporter
          EXPOSE 8080
          ENTRYPOINT ["/app/cloudeye-exporter"]
          CMD ["--config=/app/clouds.yml"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-patched-arm64 \
            ./cloudeye-exporter
          docker images | grep ${{ env.IMAGE_NAME }}

      - name: Save image as tar
        run: |
          TAR_NAME=${{ env.IMAGE_NAME }}-${{ steps.version.outputs.tag }}-patched-arm64.tar
          docker save ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-patched-arm64 -o "$TAR_NAME"
          echo "tar_name=$TAR_NAME" >> $GITHUB_OUTPUT
          ls -lh "$TAR_NAME"

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-${{ steps.version.outputs.tag }}-patched-arm64
          path: ${{ env.IMAGE_NAME }}-${{ steps.version.outputs.tag }}-patched-arm64.tar
          compression-level: 0

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-${{ steps.version.outputs.tag }}-patched-arm64-binary
          path: ./cloudeye-exporter/cloudeye-exporter
