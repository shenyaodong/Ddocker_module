name: Build CES Exporter (Release → ARM64 tar)

on:
  workflow_dispatch:

env:
  IMAGE_NAME: cloudeye-exporter
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # =====================================================
    # 1. 获取最新 Release Tag
    # =====================================================
    - name: Get latest release tag
      id: release
      run: |
        TAG=$(curl -s https://api.github.com/repos/huaweicloud/cloudeye-exporter/releases/latest \
          | grep tag_name | cut -d '"' -f4)
        echo "Using release: $TAG"
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    # =====================================================
    # 2. Clone Release 代码
    # =====================================================
    - name: Clone cloudeye-exporter (Release)
      run: |
        git clone https://github.com/huaweicloud/cloudeye-exporter.git
        cd cloudeye-exporter
        git checkout ${{ steps.release.outputs.tag }}
        git log -1 --oneline

    # =====================================================
    # 3. Setup Go
    # =====================================================
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.21"

    # =====================================================
    # 4. Build ARM64 binary
    # =====================================================
    - name: Build ARM64 binary
      working-directory: ./cloudeye-exporter
      run: |
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -ldflags="-s -w" \
          -o cloudeye-exporter main.go
        file cloudeye-exporter

    # =====================================================
    # 5. Create Dockerfile
    # =====================================================
    - name: Create Dockerfile
      working-directory: ./cloudeye-exporter
      run: |
        cat > Dockerfile << 'EOF'
        FROM arm64v8/alpine:3.19
        RUN apk add --no-cache ca-certificates tzdata
        WORKDIR /app
        COPY cloudeye-exporter /app/cloudeye-exporter
        EXPOSE 8080
        ENTRYPOINT ["/app/cloudeye-exporter"]
        EOF

    # =====================================================
    # 6. Setup QEMU & Buildx
    # =====================================================
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # =====================================================
    # 7. Build ARM64 image（本地）
    # =====================================================
    - name: Build ARM64 image
      run: |
        docker buildx build \
          --platform linux/arm64 \
          -t $IMAGE_NAME:${{ steps.release.outputs.tag }}-arm64 \
          --load \
          ./cloudeye-exporter

    # =====================================================
    # 8. Save image to tar
    # =====================================================
    - name: Save image to tar
      run: |
        TAR=cloudeye-exporter-${{ steps.release.outputs.tag }}-arm64.tar
        docker save $IMAGE_NAME:${{ steps.release.outputs.tag }}-arm64 -o $TAR
        ls -lh $TAR

    # =====================================================
    # 9. Upload tar as artifact
    # =====================================================
    - name: Upload tar artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-${{ steps.release.outputs.tag }}-arm64
        path: cloudeye-exporter-${{ steps.release.outputs.tag }}-arm64.tar
        compression-level: 0
