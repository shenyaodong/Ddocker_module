name: Build CES Exporter ARM64 Image (Tar Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    # ============================================
    # 1. 克隆 CES Exporter 源码（使用默认分支）
    # ============================================
    - name: Clone CES Exporter source
      run: |
        git clone --depth 1 https://github.com/huaweicloud/cloudeye-exporter.git cloudeye-exporter
        cd cloudeye-exporter
        echo "=== Repository info ==="
        git branch -a
        echo "=== Latest commit ==="
        git log -1 --oneline
        echo "=== Files ==="
        ls -la
    
    # ============================================
    # 2. 设置 Go 环境
    # ============================================
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    # ============================================
    # 3. 编译 ARM64 二进制
    # ============================================
    - name: Build ARM64 binary
      working-directory: ./cloudeye-exporter
      run: |
        go mod download
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cloudeye-exporter main.go
        file cloudeye-exporter
    
    # ============================================
    # 4. 创建配置文件
    # ============================================
    - name: Create config files
      working-directory: ./cloudeye-exporter
      run: |
        cat > clouds.yml << 'EOF'
        global:
          port: 8080
          scrape_configs:
            - region: "cn-north-4"
              access_key: ""
              secret_key: ""
        services:
          - service: "SYS.GAUSSDBV5"
            resources:
              - "gaussdb_instance_id"
        EOF
        
        cat > metric.yml << 'EOF'
        metrics:
          - namespace: SYS.GAUSSDBV5
            metric_name:
              - "cpu_usage"
              - "mem_usage"
              - "conn_count"
              - "qps"
              - "tps"
              - "slow_queries"
        EOF
    
    # ============================================
    # 5. 创建 Dockerfile（ARM64 专用）
    # ============================================
    - name: Create Dockerfile
      working-directory: ./cloudeye-exporter
      run: |
        cat > Dockerfile << 'EOF'
        FROM arm64v8/alpine:latest
        
        RUN apk add --no-cache ca-certificates tzdata
        
        WORKDIR /app
        
        COPY cloudeye-exporter /app/cloudeye-exporter
        COPY clouds.yml /app/clouds.yml
        COPY metric.yml /app/metric.yml
        
        RUN chmod +x /app/cloudeye-exporter
        
        EXPOSE 8080
        
        ENTRYPOINT ["/app/cloudeye-exporter"]
        CMD ["--config=/app/clouds.yml", "--metric=/app/metric.yml"]
        EOF
    
    # ============================================
    # 6. 设置 QEMU
    # ============================================
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    
    # ============================================
    # 7. 设置 Docker Buildx
    # ============================================
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # ============================================
    # 8. 构建 ARM64 镜像
    # ============================================
    - name: Build ARM64 image
      run: |
        docker buildx build \
          --platform linux/arm64 \
          -t cloudeye-exporter:arm64 \
          --load \
          ./cloudeye-exporter
    
    # ============================================
    # 9. 导出镜像为 tar 文件
    # ============================================
    - name: Save image as tar
      run: |
        docker save cloudeye-exporter:arm64 -o cloudeye-exporter-arm64.tar
        ls -lh cloudeye-exporter-arm64.tar
    
    # ============================================
    # 10. 上传 tar 文件作为 Artifact
    # ============================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-arm64
        path: cloudeye-exporter-arm64.tar
        compression-level: 0
    
    # ============================================
    # 11. 上传二进制文件
    # ============================================
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-arm64-binary
        path: ./cloudeye-exporter/cloudeye-exporter
