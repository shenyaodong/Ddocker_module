name: Build CES Exporter ARM64 (Patched)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '指定版本（留空则使用最新 Release）'
        required: false
        default: ''

env:
  IMAGE_NAME: cloudeye-exporter
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # =====================================================
    # 1. 获取版本信息
    # =====================================================
    - name: Get version info
      id: version
      run: |
        if [ -z "${{ github.event.inputs.version }}" ]; then
          # 获取最新 Release Tag
          TAG=$(curl -s https://api.github.com/repos/huaweicloud/cloudeye-exporter/releases/latest \
            | grep tag_name | cut -d '"' -f4)
          echo "Using latest release: $TAG"
        else
          TAG="${{ github.event.inputs.version }}"
          echo "Using specified version: $TAG"
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$TAG" >> $GITHUB_OUTPUT

    # =====================================================
    # 2. Clone 源码
    # =====================================================
    - name: Clone cloudeye-exporter
      run: |
        git clone https://github.com/huaweicloud/cloudeye-exporter.git
        cd cloudeye-exporter
        git checkout ${{ steps.version.outputs.tag }}
        echo "=== Current commit ==="
        git log -1 --oneline

    # =====================================================
    # 3. 补丁1：修复 logs/logs.go 空指针
    # =====================================================
    - name: Patch logs.go - add nil pointer check
      working-directory: ./cloudeye-exporter
      run: |
        set -e
        echo "=== Original Errorf function ==="
        grep -A8 "func (lc \*LoggerConstructor) Errorf" logs/logs.go || true
        
        # 使用 awk 重写 Errorf 函数，添加空指针保护
        awk '
          BEGIN { in_func=0; printed=0 }
          /func \(lc \*LoggerConstructor\) Errorf/ { in_func=1 }
          in_func && /^}/ && !printed {
            print "func (lc *LoggerConstructor) Errorf(format string, v ...interface{}) {"
            print "    if lc == nil || lc.logger == nil {"
            print "        fmt.Printf(\"[ERROR] \"+format+\"\\n\", v...)"
            print "        return"
            print "    }"
            print "    lc.logger.Errorf(format, v...)"
            print "}"
            printed=1
            in_func=0
            next
          }
          !in_func { print }
        ' logs/logs.go > logs/logs.go.tmp
        
        mv logs/logs.go.tmp logs/logs.go
        
        # 确保导入了 fmt 包
        if ! grep -q "^[[:space:]]*\"fmt\"" logs/logs.go; then
          sed -i '/^import (/a\    "fmt"' logs/logs.go
        fi
        
        echo "=== Patched Errorf function ==="
        grep -A8 "func (lc \*LoggerConstructor) Errorf" logs/logs.go

    # =====================================================
    # 4. 补丁2：修复 main.go 初始化顺序
    # =====================================================
    - name: Patch main.go - fix init order
      working-directory: ./cloudeye-exporter
      run: |
        set -e
        echo "=== Original initConf function ==="
        grep -A30 "func initConf()" main.go | head -40
        
        # 备份原文件
        cp main.go main.go.bak
        
        # 在 initConf 函数开头添加日志初始化检查
        awk '
          /^func initConf\(\) {/ {
            print "func initConf() {"
            print "    // 确保日志系统已初始化"
            print "    if err := logs.InitLogger(); err != nil {"
            print "        fmt.Printf(\"FATAL: failed to init logger: %v\\n\", err)"
            print "        return"
            print "    }"
            print ""
            in_func=1
            next
          }
          in_func && /}/ {
            print "}"
            in_func=0
            next
          }
          !in_func { print }
        ' main.go > main.go.tmp
        
        mv main.go.tmp main.go
        
        # 确保导入了 fmt 包
        if ! grep -q "^[[:space:]]*\"fmt\"" main.go; then
          sed -i '/^import (/a\    "fmt"' main.go
        fi
        
        echo "=== Patched initConf function ==="
        grep -A35 "func initConf()" main.go | head -40

    # =====================================================
    # 5. 验证补丁是否成功
    # =====================================================
    - name: Verify patches
      working-directory: ./cloudeye-exporter
      run: |
        echo "=== Checking logs.go patch ==="
        grep -q "if lc == nil || lc.logger == nil" logs/logs.go && echo "✓ logs.go patch applied" || echo "✗ logs.go patch failed"
        
        echo "=== Checking main.go patch ==="
        grep -q "logs.InitLogger()" main.go && echo "✓ main.go patch applied" || echo "✗ main.go patch failed"
        
        echo "=== Checking fmt import ==="
        grep "fmt" logs/logs.go | head -2
        grep "fmt" main.go | head -2

    # =====================================================
    # 6. Setup Go
    # =====================================================
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # =====================================================
    # 7. Build ARM64 binary
    # =====================================================
    - name: Build ARM64 binary
      working-directory: ./cloudeye-exporter
      run: |
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -ldflags="-s -w" \
          -o cloudeye-exporter main.go
        file cloudeye-exporter
        ls -lh cloudeye-exporter

    # =====================================================
    # 8. 创建配置文件模板
    # =====================================================
    - name: Create config files
      working-directory: ./cloudeye-exporter
      run: |
        cat > clouds.yml << 'EOF'
        global:
          port: 8080
          # 指定 metric.yml 路径
          metrics_conf_path: "/app/metric.yml"
        
        auth:
          auth_url: "https://iam.{region}.myhuaweicloud.com/v3"
          project_name: "{your_project_name}"
          access_key: ""
          secret_key: ""
          region: "{your_region}"
        
        services:
          - service: "SYS.ECS"
            resources:
              - "instance_id"
          - service: "SYS.GAUSSDBV5"
            resources:
              - "gaussdb_instance_id"
          - service: "SYS.MRS"
            resources:
              - "cluster_id"
          - service: "SYS.DCS"
            resources:
              - "dcs_instance_id"
        EOF
        
        cat > metric.yml << 'EOF'
        metrics:
          - namespace: SYS.GAUSSDBV5
            metric_name:
              - "cpu_usage"
              - "mem_usage"
              - "conn_count"
              - "qps"
              - "tps"
          - namespace: SYS.ECS
            metric_name:
              - "cpu_util"
              - "mem_util"
          - namespace: SYS.MRS
            metric_name:
              - "cpu_usage"
              - "mem_usage"
              - "yarn_apps_running"
              - "yarn_apps_pending"
          - namespace: SYS.DCS
            metric_name:
              - "cpu_usage"
              - "mem_usage"
              - "connected_clients"
        EOF

    # =====================================================
    # 9. 创建 Dockerfile
    # =====================================================
    - name: Create Dockerfile
      working-directory: ./cloudeye-exporter
      run: |
        cat > Dockerfile << 'EOF'
        FROM arm64v8/alpine:3.19
        
        RUN apk add --no-cache ca-certificates tzdata
        
        WORKDIR /app
        
        COPY cloudeye-exporter /app/cloudeye-exporter
        COPY clouds.yml /app/clouds.yml
        COPY metric.yml /app/metric.yml
        
        RUN chmod +x /app/cloudeye-exporter
        
        EXPOSE 8080
        
        ENTRYPOINT ["/app/cloudeye-exporter"]
        CMD ["--config=/app/clouds.yml"]
        EOF

    # =====================================================
    # 10. Setup QEMU & Buildx
    # =====================================================
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # =====================================================
    # 11. Build ARM64 image
    # =====================================================
    - name: Build ARM64 image
      run: |
        docker buildx build \
          --platform linux/arm64 \
          --load \
          -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-patched-arm64 \
          ./cloudeye-exporter
        docker images | grep ${{ env.IMAGE_NAME }}

    # =====================================================
    # 12. Save image as tar
    # =====================================================
    - name: Save image as tar
      run: |
        TAR_NAME=${{ env.IMAGE_NAME }}-${{ steps.version.outputs.tag }}-patched-arm64.tar
        docker save ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-patched-arm64 -o $TAR_NAME
        echo "=== Image saved ==="
        ls -lh $TAR_NAME
        echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

    # =====================================================
    # 13. Upload artifacts
    # =====================================================
    - name: Upload image tar
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-${{ steps.version.outputs.tag }}-patched-arm64
        path: ${{ env.TAR_NAME }}
        compression-level: 0

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-${{ steps.version.outputs.tag }}-patched-arm64-binary
        path: ./cloudeye-exporter/cloudeye-exporter

    - name: Upload config templates
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-config-templates
        path: |
          ./cloudeye-exporter/clouds.yml
          ./cloudeye-exporter/metric.yml
