name: Build CES Exporter ARM64 Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Specify version (leave empty for latest release)'
        required: false
        default: ''
        type: string

env:
  IMAGE_NAME: cloudeye-exporter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version info
        id: version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            TAG=$(curl -s https://api.github.com/repos/huaweicloud/cloudeye-exporter/releases/latest \
              | grep tag_name | cut -d '"' -f4)
            echo "Using latest release: $TAG"
          else
            TAG="${{ github.event.inputs.version }}"
            echo "Using specified version: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Clone cloudeye-exporter
        run: |
          git clone https://github.com/huaweicloud/cloudeye-exporter.git
          cd cloudeye-exporter
          git checkout ${{ steps.version.outputs.tag }}
          echo "Current commit:"
          git log -1 --oneline

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build ARM64 binary
        working-directory: ./cloudeye-exporter
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cloudeye-exporter main.go
          file cloudeye-exporter
          ls -lh cloudeye-exporter

      - name: Create config files
        working-directory: ./cloudeye-exporter
        run: |
          cat > clouds.yml << 'EOF'
          global:
            port: 8080
            metrics_conf_path: "/app/metric.yml"

          auth:
            auth_url: "https://iam.{region}.myhuaweicloud.com/v3"
            project_name: "{your_project_name}"
            access_key: ""
            secret_key: ""
            region: "{your_region}"

          services:
            - service: "SYS.ECS"
              resources:
                - "instance_id"
          EOF

          cat > metric.yml << 'EOF'
          metrics:
            - namespace: SYS.ECS
              metric_name:
                - "cpu_util"
                - "mem_util"
          EOF

      - name: Create Dockerfile
        working-directory: ./cloudeye-exporter
        run: |
          cat > Dockerfile << 'EOF'
          FROM arm64v8/alpine:3.19
          RUN apk add --no-cache ca-certificates tzdata
          WORKDIR /app
          COPY cloudeye-exporter /app/cloudeye-exporter
          COPY clouds.yml /app/clouds.yml
          COPY metric.yml /app/metric.yml
          RUN chmod +x /app/cloudeye-exporter
          EXPOSE 8080
          ENTRYPOINT ["/app/cloudeye-exporter"]
          CMD ["--config=/app/clouds.yml"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64 \
            ./cloudeye-exporter
          docker images | grep ${{ env.IMAGE_NAME }}

      - name: Save image as tar
        run: |
          TAR_NAME=${{ env.IMAGE_NAME }}-${{ steps.version.outputs.tag }}-arm64.tar
          docker save ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-arm64 -o "$TAR_NAME"
          echo "tar_name=$TAR_NAME" >> $GITHUB_OUTPUT
          ls -lh "$TAR_NAME"

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-${{ steps.version.outputs.tag }}-arm64
          path: ${{ env.IMAGE_NAME }}-${{ steps.version.outputs.tag }}-arm64.tar
          compression-level: 0

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-${{ steps.version.outputs.tag }}-arm64-binary
          path: ./cloudeye-exporter/cloudeye-exporter
