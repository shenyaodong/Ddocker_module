name: Build Cloudeye Exporter (ARM64, metric enabled, tar only)

on:
  workflow_dispatch:

env:
  IMAGE_NAME: cloudeye-exporter
  IMAGE_TAG: metric-arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # =====================================================
    # 1. Clone official cloudeye-exporter
    # =====================================================
    - name: Clone cloudeye-exporter source
      run: |
        git clone https://github.com/huaweicloud/cloudeye-exporter.git
        cd cloudeye-exporter
        git log -1 --oneline

    # =====================================================
    # 2. Patch logger nil panic (critical fix)
    # =====================================================
    - name: Patch logger nil panic
      working-directory: ./cloudeye-exporter
      run: |
        set -e
        sed -i 's/panic("logger is nil")/fmt.Printf("[ERROR] "+format+"\\n", v...); return/' logs/logs.go
        grep -n "fmt.Printf" logs/logs.go

    # =====================================================
    # 3. Verify -metric flag exists in source (compile-time)
    # =====================================================
    - name: Verify -metric flag exists
      working-directory: ./cloudeye-exporter
      run: |
        if ! grep -R "flag.*metric" -n main.go; then
          echo "ERROR: -metric flag not found in source code"
          exit 1
        fi
        echo "OK: -metric flag found in source"

    # =====================================================
    # 4. Setup Go
    # =====================================================
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # =====================================================
    # 5. Build ARM64 binary
    # =====================================================
    - name: Build ARM64 binary
      working-directory: ./cloudeye-exporter
      run: |
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -ldflags="-s -w" \
          -o cloudeye-exporter main.go
        file cloudeye-exporter

    # =====================================================
    # 6. Create Dockerfile
    # =====================================================
    - name: Create Dockerfile
      working-directory: ./cloudeye-exporter
      run: |
        cat > Dockerfile << 'EOF'
        FROM arm64v8/alpine:3.19
        RUN apk add --no-cache ca-certificates tzdata
        WORKDIR /app
        COPY cloudeye-exporter /app/cloudeye-exporter
        EXPOSE 8080
        ENTRYPOINT ["/app/cloudeye-exporter"]
        EOF

    # =====================================================
    # 7. Setup QEMU (for ARM64 container run)
    # =====================================================
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # =====================================================
    # 8. Setup Docker Buildx
    # =====================================================
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # =====================================================
    # 9. Build ARM64 image locally
    # =====================================================
    - name: Build ARM64 image (local)
      run: |
        docker buildx build \
          --platform linux/arm64 \
          -t $IMAGE_NAME:$IMAGE_TAG \
          --load \
          ./cloudeye-exporter

    # =====================================================
    # 10. Runtime verify -metric inside ARM64 container ✅
    # =====================================================
    - name: Verify -metric flag inside container
      run: |
        docker run --rm --platform linux/arm64 \
          $IMAGE_NAME:$IMAGE_TAG \
          -h | grep -- "-metric"

    # =====================================================
    # 11. Save image to tar
    # =====================================================
    - name: Save image to tar
      run: |
        docker save $IMAGE_NAME:$IMAGE_TAG \
          -o cloudeye-exporter-metric-arm64.tar
        ls -lh cloudeye-exporter-metric-arm64.tar

    # =====================================================
    # 12. Upload tar as artifact
    # =====================================================
    - name: Upload image tar artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-metric-arm64
        path: cloudeye-exporter-metric-arm64.tar
        compression-level: 0
