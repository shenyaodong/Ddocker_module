name: Build New Cloudeye Exporter ARM64 (Metric Supported)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # =====================================================
    # 1. Clone cloudeye-exporter (new version)
    # =====================================================
    - name: Clone cloudeye-exporter source
      run: |
        git clone https://github.com/huaweicloud/cloudeye-exporter.git
        cd cloudeye-exporter

        # ✅ 切换到已验证支持 -metric 的稳定提交
        git checkout 6c6a2b6

        echo "Using commit:"
        git log -1 --oneline

    # =====================================================
    # 2. Apply panic-fix patch (logger nil guard)
    # =====================================================
    - name: Patch logger panic bug
      working-directory: ./cloudeye-exporter
      run: |
        sed -i 's/logger.Errorf(/if logger != nil { logger.Errorf(/g' logs/logs.go
        sed -i 's/)$)/) }/g' logs/logs.go || true

        echo "Patched logger nil guard"

    # =====================================================
    # 3. Setup Go
    # =====================================================
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    # =====================================================
    # 4. Build ARM64 binary
    # =====================================================
    - name: Build ARM64 binary
      working-directory: ./cloudeye-exporter
      run: |
        go mod tidy
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
          go build -ldflags="-s -w" \
          -o cloudeye-exporter main.go
        file cloudeye-exporter

    # =====================================================
    # 5. Create Dockerfile
    # =====================================================
    - name: Create Dockerfile
      working-directory: ./cloudeye-exporter
      run: |
        cat > Dockerfile << 'EOF'
        FROM arm64v8/alpine:3.19

        RUN apk add --no-cache ca-certificates tzdata

        WORKDIR /app
        COPY cloudeye-exporter /app/cloudeye-exporter

        EXPOSE 8080
        ENTRYPOINT ["/app/cloudeye-exporter"]
        EOF

    # =====================================================
    # 6. Setup QEMU
    # =====================================================
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # =====================================================
    # 7. Setup Docker Buildx
    # =====================================================
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # =====================================================
    # 8. Build ARM64 image
    # =====================================================
    - name: Build ARM64 image
      run: |
        docker buildx build \
          --platform linux/arm64 \
          -t cloudeye-exporter:new-arm64 \
          --load \
          ./cloudeye-exporter

    # =====================================================
    # 9. Save image as tar
    # =====================================================
    - name: Save image as tar
      run: |
        docker save cloudeye-exporter:new-arm64 -o cloudeye-exporter-new-arm64.tar

    # =====================================================
    # 10. Upload image artifact
    # =====================================================
    - name: Upload image artifact
      uses: actions/upload-artifact@v4
      with:
        name: cloudeye-exporter-new-arm64
        path: cloudeye-exporter-new-arm64.tar
        compression-level: 0
