name: Build CES Exporter ARM64 (Patched)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Specify version (leave empty for latest release)'
        required: false
        default: ''
        type: string

env:
  IMAGE_NAME: cloudeye-exporter

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version info
        id: version
        run: |
          if [ -z "${{ github.event.inputs.version }}" ]; then
            TAG=$(curl -s https://api.github.com/repos/huaweicloud/cloudeye-exporter/releases/latest \
              | grep tag_name | cut -d '"' -f4)
            echo "Using latest release: $TAG"
          else
            TAG="${{ github.event.inputs.version }}"
            echo "Using specified version: $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Clone cloudeye-exporter
        run: |
          git clone https://github.com/huaweicloud/cloudeye-exporter.git
          cd cloudeye-exporter
          git checkout ${{ steps.version.outputs.tag }}
          echo "Current commit:"
          git log -1 --oneline

      - name: Inspect logs package
        working-directory: ./cloudeye-exporter
        run: |
          echo "=== logs directory content ==="
          ls -la logs/
          echo ""
          echo "=== logs/logs.go content ==="
          cat logs/logs.go
          echo ""
          echo "=== Search for Init function ==="
          grep -n "func.*Init" logs/*.go || echo "No Init function found"

      - name: Patch logs.go - add nil check and Init function
        working-directory: ./cloudeye-exporter
        run: |
          python3 << 'PYTHON_PATCH'
          import re
          
          # 读取 logs.go
          with open('logs/logs.go', 'r') as f:
              content = f.read()
          
          # 1. 修复 Errorf 函数
          if 'if lc == nil || lc.logger == nil' not in content:
              pattern = r'(func\s+\(lc\s+\*LoggerConstructor\)\s+Errorf\s*\([^)]+\)\s*\{)\s*\n'
              def add_check(m):
                  return m.group(1) + '\n    if lc == nil || lc.logger == nil {\n        fmt.Printf("[ERROR] "+format+"\\n", v...)\n        return\n    }\n'
              content = re.sub(pattern, add_check, content, flags=re.MULTILINE)
          
          # 2. 添加 InitLogger 函数（如果不存在）
          if 'func InitLogger()' not in content:
              init_func = '''
          // InitLogger initializes the global logger
          func InitLogger() error {
              if logger == nil {
                  logger = &LoggerConstructor{}
                  // Initialize with default config
                  logger.logger, _ = zap.NewProduction()
              }
              return nil
          }
          '''
              # 在文件末尾添加
              content = content.rstrip() + '\n' + init_func
          
          # 3. 确保导入了 fmt 和 go.uber.org/zap
          imports_to_add = []
          if 'import (' in content:
              if '"fmt"' not in content:
                  imports_to_add.append('"fmt"')
              if '"go.uber.org/zap"' not in content:
                  imports_to_add.append('"go.uber.org/zap"')
              
              if imports_to_add:
                  for imp in imports_to_add:
                      content = content.replace('import (', 'import (\n\t' + imp)
          
          with open('logs/logs.go', 'w') as f:
              f.write(content)
          
          print("Patched logs.go")
          PYTHON_PATCH

      - name: Patch main.go - fix init order
        working-directory: ./cloudeye-exporter
        run: |
          python3 << 'PYTHON_PATCH'
          import re
          
          with open('main.go', 'r') as f:
              content = f.read()
          
          # 在 initConf 函数开头添加日志初始化
          pattern = r'(func\s+initConf\s*\(\)\s*\{)\s*\n'
          
          def add_init(m):
              return m.group(1) + '\n    // Ensure logger is initialized\n    if err := logs.InitLogger(); err != nil {\n        fmt.Printf("FATAL: failed to init logger: %v\\n", err)\n        return\n    }\n'
          
          content = re.sub(pattern, add_init, content, flags=re.MULTILINE)
          
          # 确保导入了 fmt 包
          if 'import (' in content and '"fmt"' not in content:
              content = content.replace('import (', 'import (\n\t"fmt"')
          
          with open('main.go', 'w') as f:
              f.write(content)
          
          print("Patched main.go")
          PYTHON_PATCH

      - name: Verify patches
        working-directory: ./cloudeye-exporter
        run: |
          echo "=== logs.go patch verification ==="
          grep -n "if lc == nil || lc.logger == nil" logs/logs.go && echo "✓ Errorf nil check added" || echo "⚠ Errorf nil check not found"
          grep -n "func InitLogger()" logs/logs.go && echo "✓ InitLogger function added" || echo "⚠ InitLogger function not found"
          
          echo ""
          echo "=== main.go patch verification ==="
          grep -n "logs.InitLogger()" main.go && echo "✓ InitLogger call added" || echo "⚠ InitLogger call not found"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build ARM64 binary
        working-directory: ./cloudeye-exporter
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cloudeye-exporter main.go
          file cloudeye-exporter
          ls -lh cloudeye-exporter

      - name: Create config files
        working-directory: ./cloudeye-exporter
        run: |
          cat > clouds.yml << 'EOF'
          global:
            port: 8080
            metrics_conf_path: "/app/metric.yml"

          auth:
            auth_url: "https://iam.{region}.myhuaweicloud.com/v3"
            project_name: "{your_project_name}"
            access_key: ""
            secret_key: ""
            region: "{your_region}"

          services:
            - service: "SYS.ECS"
              resources:
                - "instance_id"
          EOF

          cat > metric.yml << 'EOF'
          metrics:
            - namespace: SYS.ECS
              metric_name:
                - "cpu_util"
                - "mem_util"
          EOF

      - name: Create Dockerfile
        working-directory: ./cloudeye-exporter
        run: |
          cat > Dockerfile << 'EOF'
          FROM arm64v8/alpine:3.19
          RUN apk add --no-cache ca-certificates tzdata
          WORKDIR /app
          COPY cloudeye-exporter /app/cloudeye-exporter
          COPY clouds.yml /app/clouds.yml
          COPY metric.yml /app/metric.yml
          RUN chmod +x /app/cloudeye-exporter
          EXPOSE 8080
          ENTRYPOINT ["/app/cloudeye-exporter"]
          CMD ["--config=/app/clouds.yml"]
          EOF

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-patched-arm64 \
            ./cloudeye-exporter
          docker images | grep ${{ env.IMAGE_NAME }}

      - name: Save image as tar
        run: |
          TAR_NAME=${{ env.IMAGE_NAME }}-${{ steps.version.outputs.tag }}-patched-arm64.tar
          docker save ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}-patched-arm64 -o "$TAR_NAME"
          echo "tar_name=$TAR_NAME" >> $GITHUB_OUTPUT
          ls -lh "$TAR_NAME"

      - name: Upload image tar
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-${{ steps.version.outputs.tag }}-patched-arm64
          path: ${{ env.IMAGE_NAME }}-${{ steps.version.outputs.tag }}-patched-arm64.tar
          compression-level: 0

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cloudeye-exporter-${{ steps.version.outputs.tag }}-patched-arm64-binary
          path: ./cloudeye-exporter/cloudeye-exporter
