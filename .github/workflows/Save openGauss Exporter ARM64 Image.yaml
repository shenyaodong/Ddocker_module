name: Save openGauss Exporter ARM64 Image

on:
  workflow_dispatch:

jobs:
  save-image:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 使用 GitHub 上的镜像仓库 (更稳定，无需认证)
    - name: Clone openGauss-exporter source (from GitHub mirror)
      run: |
        git clone --depth 1 https://github.com/Enmotech/opengauss_exporter.git openGauss-exporter
        cd openGauss-exporter
        echo "Latest commit:"
        git log -1 --oneline

    - name: Create Dockerfile for ARM64
      run: |
        cd openGauss-exporter
        cat > Dockerfile.arm64 << 'EOF'
        # 多阶段构建
        FROM --platform=$BUILDPLATFORM golang:1.21-alpine AS builder
        
        ARG TARGETOS
        ARG TARGETARCH
        
        RUN apk add --no-cache git make
        
        WORKDIR /workspace
        
        COPY . .
        
        RUN go mod download
        RUN CGO_ENABLED=0 GOOS=$TARGETOS GOARCH=$TARGETARCH \
            go build -ldflags="-s -w" \
            -o opengauss_exporter cmd/opengauss_exporter/main.go
        
        FROM --platform=$TARGETPLATFORM alpine:3.19
        
        RUN apk add --no-cache ca-certificates tzdata
        
        WORKDIR /app
        
        COPY --from=builder /workspace/opengauss_exporter /app/opengauss_exporter
        
        RUN chmod +x /app/opengauss_exporter
        
        EXPOSE 9187
        
        ENTRYPOINT ["/app/opengauss_exporter"]
        CMD ["--web.listen-address=:9187"]
        EOF

    - name: Build ARM64 Docker image
      run: |
        cd openGauss-exporter
        docker buildx build \
          --platform linux/arm64 \
          --load \
          -t opengauss-exporter:arm64 \
          -f Dockerfile.arm64 \
          .
        docker images | grep opengauss-exporter

    - name: Save image as tar
      run: |
        docker save opengauss-exporter:arm64 -o opengauss-exporter-arm64.tar
        ls -lh opengauss-exporter-arm64.tar

    - name: Upload tar file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: opengauss-exporter-arm64
        path: opengauss-exporter-arm64.tar
        compression-level: 0
