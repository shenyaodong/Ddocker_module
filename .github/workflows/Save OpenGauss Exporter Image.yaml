name: Save OpenGauss Exporter Image

on:
  workflow_dispatch:

jobs:
  save-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Pull OpenGauss Exporter Image
        run: docker pull --platform linux/arm64 enmotech/opengauss-exporter:v1.2.0

      - name: Save OpenGauss Exporter Image as tar
        run: docker save enmotech/opengauss-exporter:v1.2.0 -o opengauss_exporter-arm64.tar

      - name: Upload tar file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengauss_exporter-arm64
          path: opengauss_exporter-arm64.tar
