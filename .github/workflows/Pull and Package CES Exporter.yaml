name: Pull CES Exporter from HuaweiCloud SWR

on:
  workflow_dispatch:

jobs:
  pull-and-package:
    runs-on: ubuntu-latest
    
    steps:
    # 登录华为云 SWR
    - name: Login to HuaweiCloud SWR
      uses: docker/login-action@v3
      with:
        registry: swr.cn-north-4.myhuaweicloud.com
        username: ${{ secrets.SWR_USERNAME }}
        password: ${{ secrets.SWR_PASSWORD }}

    # 拉取 ARM64 镜像
    - name: Pull ARM64 image
      run: |
        docker pull --platform linux/arm64 swr.cn-north-4.myhuaweicloud.com/opensource/cloudeye-exporter:latest
        docker images | grep cloudeye

    # 打本地标签
    - name: Tag image
      run: |
        docker tag swr.cn-north-4.myhuaweicloud.com/opensource/cloudeye-exporter:latest ces-exporter:arm64

    # 导出为 tar
    - name: Save to tar
      run: |
        docker save ces-exporter:arm64 -o ces-exporter-arm64.tar
        gzip ces-exporter-arm64.tar
        ls -lh ces-exporter-arm64.tar.gz

    # 上传 artifact
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ces-exporter-arm64
        path: ces-exporter-arm64.tar.gz
        retention-days: 30

    # 输出说明
    - name: Show instructions
      run: |
        echo "✅ 镜像打包完成！"
        echo "下载 ces-exporter-arm64.tar.gz"
