name: Build CES Exporter for ARM64

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone and patch source
        run: |
          # 克隆官方仓库
          git clone https://github.com/huaweicloud/cloudeye-exporter.git
          cd cloudeye-exporter
          
          # 获取并切换到最新的稳定版本标签
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          git checkout $LATEST_TAG
          echo "Building version: $LATEST_TAG"

          # --- 关键修复：修复 logs.go 中的 nil pointer 问题 ---
          # 使用 sed 命令精确地在所有日志函数入口处添加 nil 检查
          sed -i '/^func (lc \*LoggerConstructor) Errorf(/a \	if lc == nil || lc.logger == nil {\n\t\tfmt.Printf("[ERROR] "+format+"\\n", v...)\n\t\treturn\n\t}' logs/logs.go
          sed -i '/^func (lc \*LoggerConstructor) Warnf(/a \	if lc == nil || lc.logger == nil {\n\t\tfmt.Printf("[WARN] "+format+"\\n", v...)\n\t\treturn\n\t}' logs/logs.go
          sed -i '/^func (lc \*LoggerConstructor) Infof(/a \	if lc == nil || lc.logger == nil {\n\t\tfmt.Printf("[INFO] "+format+"\\n", v...)\n\t\treturn\n\t}' logs/logs.go
          
          # 确保导入了 fmt 包 (如果缺失)
          if ! grep -q '"fmt"' logs/logs.go; then
            sed -i '/^import (/a \	"fmt"' logs/logs.go
          fi
          
          echo "✅ Source code patched successfully."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build ARM64 binary
        working-directory: ./cloudeye-exporter
        run: |
          go mod download
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o cloudeye-exporter main.go
          file cloudeye-exporter

      - name: Build Docker image and export tar
        working-directory: ./cloudeye-exporter
        run: |
          # 创建 Dockerfile
          cat > Dockerfile << 'EOF'
FROM alpine:3.19
RUN apk add --no-cache ca-certificates
COPY cloudeye-exporter /usr/local/bin/
EXPOSE 8080
ENTRYPOINT ["/usr/local/bin/cloudeye-exporter"]
EOF
          # 构建并导出镜像
          docker build -t ces-exporter:arm64 .
          docker save ces-exporter:arm64 -o ces-exporter-arm64.tar
          gzip ces-exporter-arm64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ces-exporter-arm64-image
          path: ./cloudeye-exporter/ces-exporter-arm64.tar.gz
          retention-days: 7
