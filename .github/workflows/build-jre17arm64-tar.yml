name: Download ARM64 JDK Image (UBI Minimal)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 设置 QEMU 多架构仿真（关键！让 x86 机器能拉取 ARM64 镜像）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # 2. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 3. 拉取并保存 ARM64 架构的镜像
      - name: Pull and save ARM64 Docker image
        run: |
          echo ">>> Pulling ARM64 image: eclipse-temurin:17.0.18_8-jre-ubi9-minimal"
          docker pull --platform linux/arm64 eclipse-temurin:17.0.18_8-jre-ubi9-minimal
          
          echo ">>> Verifying image architecture..."
          docker inspect eclipse-temurin:17.0.18_8-jre-ubi9-minimal | grep -A 2 "Architecture"
          
          echo ">>> Saving image to tar file..."
          docker save eclipse-temurin:17.0.18_8-jre-ubi9-minimal -o temurin-17-ubi-minimal.tar
          
          echo ">>> Compressing tar file..."
          gzip temurin-17-ubi-minimal.tar
          
          echo ">>> File size:"
          ls -lh temurin-17-ubi-minimal.tar.gz
      
      # 4. 上传压缩包供下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: temurin-17-jre-ubi-minimal-arm64
          path: temurin-17-ubi-minimal.tar.gz
          retention-days: 7
