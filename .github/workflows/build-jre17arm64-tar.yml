name: Download ARM64 JDK Image

on:
  workflow_dispatch:  # 手动触发，方便你随时下载

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 设置 QEMU 多架构仿真（关键！让 x86 机器能拉取 ARM64 镜像）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      # 2. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 3. 拉取并保存 ARM64 架构的镜像
      - name: Pull and save ARM64 Docker image
        run: |
          # 拉取 ARM64 版本的 OpenJDK 17 JRE 镜像
          docker pull --platform linux/arm64 eclipse-temurin:17-jre-alpine
          
          # 保存为 tar 文件
          docker save eclipse-temurin:17-jre-alpine -o temurin-17-jre-alpine.tar
          
          # 压缩以减小文件大小
          gzip temurin-17-jre-alpine.tar
          
          # 查看文件
          ls -lh temurin-17-jre-alpine.tar.gz
      
      # 4. 上传压缩包供下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: temurin-17-jre-alpine-arm64
          path: temurin-17-jre-alpine.tar.gz
          retention-days: 7
